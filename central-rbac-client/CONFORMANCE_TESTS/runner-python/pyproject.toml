[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onelog-central-rbac-conformance-python"
version = "0.2.0"
description = "Conformance runner for onelog-central-rbac-client Python SDK (respx-mocked)"
requires-python = ">=3.11"
dependencies = [
    "onelog-central-rbac-client",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
