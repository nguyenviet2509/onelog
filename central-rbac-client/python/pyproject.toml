[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onelog-central-rbac-client"
version = "0.2.0"
description = "Python SDK for Central RBAC v2 — resolve, epoch poll, FastAPI/Django/Flask adapters"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "OneLog Platform" }]
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]
flask = ["flask>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onelog_central_rbac = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
