# Alertmanager — Telegram receivers for OneLog (MCP-only rollout).
#
# Pipeline: vmalert (LogsQL stats) → alertmanager → Telegram Bot API.
# Triage flow: ops nhận alert → mở VMUI / dùng Claude+MCP.
#
# Two receivers differ ONLY by send_resolved (anti RESOLVED noise for
# one-shot events). Route matches `notify_style=event` label (set in rules.yml
# for instant/event-style rules).
#
# Token + chat_id render từ infra/.env (TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID)
# qua sed entrypoint trong docker-compose. KHÔNG run alertmanager trực tiếp trên
# file này — placeholder chưa thay.

global:
  resolve_timeout: 5m

route:
  # Default receiver = Client-Server topic (thread TELEGRAM_ALERT_THREAD_ID_CLIENT_SERVER).
  # Rsyslog forwarder giữ nguyên hostname thật của fleet client (không ép
  # naming convention). Log-server self-monitoring được whitelist bằng label
  # `host="logserver"` (Vector ép cho mọi docker + probe event) hoặc
  # `component=~"host|data-disk|root-partition|disk-probe"` (vmalert-metrics
  # scrape node_exporter của log-server + disk probe LogsQL rules).
  receiver: telegram-client-server
  # Group across hosts: cùng alertname + severity + category → 1 message
  # (dù có 200 host cùng fire). Trước đây group_by chứa `host` khiến mỗi host
  # spawn 1 Telegram message riêng → spam khi fleet-wide burst xảy ra.
  # Template render compact (chỉ list host) khi len(Alerts) > 10.
  group_by: ["alertname", "severity", "category"]
  group_wait: 30s                   # 30s window để gom burst cross-host
  group_interval: 5m
  # Bump 4h → 12h (plan 260826-1044 Phase 01). Baseline objective ~302 telegram
  # notif/24h → target ≤120/24h (~60% reduction). First fire immediate, chỉ delay
  # RE-notify của chronic groups. Security/audit override giữ 2h dưới đây.
  repeat_interval: 12h
  routes:
    # LLM cost rules (team=llm-cost): cost/balance alerts, cooldown 30m to
    # avoid billing-spike spam. Routes to LLM-Cost topic (thread từ
    # TELEGRAM_ALERT_THREAD_ID_LLM_COST) so ops sees when balance recovers.
    - matchers:
        - team="llm-cost"
      receiver: telegram-llm-cost
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m

    # ── Log-server self-monitoring → Log-Server topic (thread 880) ────────
    # Host/cluster-based routes ĐẶT TRƯỚC category/severity fallback theo
    # nguyên tắc "host ownership > alert kind" (plan 260904-0815). Log-server
    # alerts luôn về topic 880 dù có label category=audit/security.
    - matchers:
        - host="logserver"
      receiver: telegram-trend
    - matchers:
        - component="host"          # vmalert-metrics (CPU/RAM/load/swap/disk/net)
      receiver: telegram-trend
    - matchers:
        - component=~"data-disk|root-partition|disk-probe"
      receiver: telegram-trend

    # ── Authway-vps monitor (plan 260821-1013) → Log-Server topic (thread 880).
    # Reuse receiver telegram-trend: authway = infra self-monitoring ngữ nghĩa
    # đồng nhất với log-server.
    - matchers:
        - cluster="authway"
      receiver: telegram-trend

    # ── OneMCP-vps monitor (plan 260821-1346) → Log-Server topic (thread 880).
    - matchers:
        - cluster="onemcp"
      receiver: telegram-trend

    # ── Mail-server fleet (mailer-*, mta3, store.mailer, zmhn*)
    # → Mail-Server topic (thread 5228). ĐẶT TRƯỚC category=audit route để
    # mail-host SudoEscalation/AuditLoginFailures (label category=audit) KHÔNG
    # bị hijack về Client-Server topic (plan 260904-0815 bug fix).
    # Regex match cả short name (host label từ rsyslog/Vector) lẫn FQDN, đề
    # phòng host tương lai gửi kèm domain suffix.
    - matchers:
        - host=~"mailer-[0-9]+(\\.inet\\.vn)?|mta3(\\.inet\\.vn)?|store\\.mailer(\\.inet\\.vn)?|zmhn[a-z0-9]+(\\.onemail\\.vn)?"
      receiver: telegram-mail-server

    # Security/audit override — critical signals need faster re-notify than
    # 12h default. category=security|audit fires với 2h cadence bất kể severity.
    # ĐẶT SAU host-based routes để mail/log-server audit không bị hijack, TRƯỚC
    # severity=critical để win matcher order cho hosting audit events.
    - matchers:
        - category=~"security|audit"
      receiver: telegram-client-server
      repeat_interval: 2h

    # ── Fleet event-style (OomKillEvent, DiskFullErrors, NewUserOrSudoer,
    # LsphpSegfault) → Client-Server topic, send_resolved=false. Event đã xảy
    # ra rồi, RESOLVED chỉ nói "không có thêm trong 5m" → noise.
    - matchers:
        - notify_style="event"
      receiver: telegram-event

    # ── Availability chronic (lsphp OOM cluster fleet-wide) — bump
    # group_interval 5m → 15m để giảm renotify spam khi group members churn
    # theo process cycle. First fire vẫn ngay (group_wait=30s giữ default).
    # Real critical spike vẫn detect kịp thời. Plan 260904-0815 phase 03.
    - matchers:
        - category="availability"
      receiver: telegram-client-server
      group_interval: 15m
      repeat_interval: 12h

    # ── Fleet critical severity: repeat 2h (bumped 30m → 2h per plan
    # 260826-1044). Critical stays faster than warning default 12h nhưng đủ
    # rộng để chronic OOM cluster không spam.
    - matchers:
        - severity="critical"
      receiver: telegram-client-server
      repeat_interval: 2h

    # ── OneMCP webhook parallel — plan 260723-1200 Phase 4.
    # Mọi alert (severity=critical|warning) fanout thêm sang OneMCP để lookup
    # runbook match theo service/alertname. `continue: true` để KHÔNG cắt route
    # chain — Telegram vẫn nhận như cũ, OneMCP chỉ là listener bổ sung.
    # Nếu match, OneMCP post vào Slack (nếu config) kèm link portal runbook.
    - matchers:
        - severity=~"critical|warning"
      receiver: onemcp-webhook
      continue: true
      # Group riêng theo alertname+service để dedup phía OneMCP
      group_by: ["alertname", "service"]
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 1h

receivers:
  - name: telegram-trend
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        message_thread_id: __TELEGRAM_THREAD_ID__
        parse_mode: HTML
        send_resolved: true
        # Telegram cap = 4096 chars. sample_msg = raw syslog line (unbounded — kernel
         # panic dumps, MySQL error stacks, litespeed 500 dumps đều có thể >1KB).
         # Guards: (1) compact threshold >5 (thay vì >10) để burst nhiều host không
         # blow up detail path, (2) truncate sample_msg 250B + summary 200B via
         # printf "%.Ns". Worst-case detail: 5 × ~550B = ~2.7KB < 4096. Worst-case
         # compact: 10 hosts × 60B + 250B sample + 200B summary = ~1KB.
        message: &telegram_message_template |
          {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} — <b>{{ .CommonLabels.alertname }}</b>{{ if gt (len .Alerts) 1 }} (×{{ len .Alerts }}){{ end }}
          {{ with .CommonLabels.severity }}<b>severity:</b> <code>{{ . }}</code>  {{ end }}{{ with .CommonLabels.category }}<b>category:</b> <code>{{ . }}</code>{{ end }}
          {{ if gt (len .Alerts) 5 }}
          ━━━━━━━━━━━━━━━━━━━━
          <b>{{ len .Alerts }} hosts affected</b> (compact view, first 10):
          {{ range $i, $a := .Alerts }}{{ if lt $i 10 }}• <code>{{ $a.Labels.host }}</code>{{ with $a.Labels.host_ip }} (<code>{{ . }}</code>){{ end }}{{ if not $a.StartsAt.IsZero }} — {{ $a.StartsAt.Local.Format "15:04:05" }}{{ end }}
          {{ end }}{{ end }}{{ if gt (len .Alerts) 10 }}… và các host còn lại (xem VMUI để đầy đủ)
          {{ end }}{{ with (index .Alerts 0).Labels.sample_msg }}<b>sample_msg:</b> <code>{{ printf "%.250s" . }}{{ if gt (len .) 250 }}…{{ end }}</code>
          {{ end }}{{ with (index .Alerts 0).Annotations.summary }}<b>summary:</b> {{ printf "%.200s" . }}{{ if gt (len .) 200 }}…{{ end }}
          {{ end }}{{ else }}{{ range .Alerts }}
          ━━━━━━━━━━━━━━━━━━━━
          {{ with .Labels.host }}<b>host:</b>        <code>{{ . }}</code>
          {{ end }}{{ with .Labels.host_ip }}<b>host_ip:</b>     <code>{{ . }}</code>
          {{ end }}{{ with .Labels.attacker_ip }}<b>attacker_ip:</b> <code>{{ . }}</code>
          {{ end }}{{ if not .StartsAt.IsZero }}<b>started:</b>     <code>{{ .StartsAt.Local.Format "02/01/2006 15:04:05 -07:00" }}</code>
          {{ end }}{{ if and (eq $.Status "resolved") (not .EndsAt.IsZero) }}<b>ended:</b>       <code>{{ .EndsAt.Local.Format "02/01/2006 15:04:05 -07:00" }}</code>
          {{ end }}{{ with .Labels.sample_msg }}<b>msg:</b>         <code>{{ printf "%.250s" . }}{{ if gt (len .) 250 }}…{{ end }}</code>
          {{ end }}{{ with .Annotations.summary }}<b>summary:</b>     {{ printf "%.200s" . }}{{ if gt (len .) 200 }}…{{ end }}
          {{ end }}{{ end }}{{ end }}

  # Event-style rules đều fire trên fleet syslog (OOM, ENOSPC, user/sudoer thay
  # đổi, lsphp segfault) → post vào Client-Server topic thay vì Log-server.
  - name: telegram-event
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        message_thread_id: __TELEGRAM_THREAD_ID_CLIENT_SERVER__
        parse_mode: HTML
        send_resolved: false   # event-style: chỉ FIRING, không gửi RESOLVED
        message: *telegram_message_template

  # Fleet client host alerts (SystemdServiceFailed, DbConnectionRefused, brute
  # force burst, …) — Client-Server topic. send_resolved=true để ops thấy khi
  # crashloop dừng / conn-refused hết.
  - name: telegram-client-server
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        message_thread_id: __TELEGRAM_THREAD_ID_CLIENT_SERVER__
        parse_mode: HTML
        send_resolved: true
        message: *telegram_message_template

  # Mail-server fleet alerts → separate topic (thread 5228). Hardcode thread_id
  # vì đây là topic cố định cho ops mail team. send_resolved=true đồng nhất với
  # client-server style (ops thấy khi service phục hồi).
  - name: telegram-mail-server
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        message_thread_id: 5228
        parse_mode: HTML
        send_resolved: true
        message: *telegram_message_template

  # LLM cost/quota alerts → separate topic (Quota alert). Same send_resolved=true
  # semantics as telegram-trend (ops needs RESOLVED after top-up).
  - name: telegram-llm-cost
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        message_thread_id: __TELEGRAM_THREAD_ID_LLM_COST__
        parse_mode: HTML
        send_resolved: true
        message: *telegram_message_template

  # OneMCP webhook — plan 260723-1200-onemcp-openwebui-bridge Phase 4.
  # OneMCP P7 endpoint: dedup + async 202 + optional Slack notify với runbook link.
  # Bearer token render từ .env qua sed entrypoint (ONEMCP_ALERT_WEBHOOK_TOKEN).
  # Nếu OneMCP down, alertmanager retry 1 lần rồi bỏ — Telegram vẫn nhận.
  - name: onemcp-webhook
    webhook_configs:
      - url: https://10.200.0.44/api/webhooks/alertmanager
        http_config:
          authorization:
            type: Bearer
            credentials: "__ONEMCP_ALERT_WEBHOOK_TOKEN__"
          tls_config:
            # Self-signed cert — insecure_skip_verify=true trong lab.
            # Prod nên mount CA + set ca_file: /etc/alertmanager/onemcp-ca.crt
            insecure_skip_verify: true
        send_resolved: false   # OneMCP chỉ cần biết fire event để suggest runbook
        max_alerts: 0          # không giới hạn

inhibit_rules:
  # ─────────────────────────────────────────────────────────────────────
  # Memory pressure cascade — OOM-kill triggers systemd/service crash.
  # SECURITY GUARD: exclude security-service crashes (Red Team #7 —
  # attacker could deliberately OOM to kill auditd/rsyslog/fail2ban).
  # LABEL GUARD: host!="" prevents mass over-inhibition when label missing
  # (Red Team #5 — empty=empty matches everywhere).
  # Plan: 260826-1044-alert-triage-noise-reduction phase-01
  # ─────────────────────────────────────────────────────────────────────
  - source_matchers:
      - alertname="OomKillEvent"
      - host!=""
    target_matchers:
      - alertname="SystemdServiceFailed"
      - host!=""
      # Security services excluded — match on sample_msg (alerts do not carry
      # a `service` label; sample_msg = raw syslog line from row_any()).
      - sample_msg!~"(?i).*(auditd|rsyslog|fail2ban|wazuh|falco|journald).*"
    equal: [host]

  - source_matchers:
      - alertname="OomKillEvent"
      - host!=""
    target_matchers:
      - alertname="SystemdSessionLimitReached"
      - host!=""
    equal: [host]

  # Disk full inhibits downstream WARNINGS but NEVER security/audit categories
  # (Red Team #3 — attacker fills disk then attacks under alert silence).
  # Allowlist specific alertnames instead of blanket severity=warning.
  - source_matchers:
      - alertname="DiskFullErrors"
      - host!=""
    target_matchers:
      - alertname=~"MysqlErrorBurst|WebServerErrorBurst|SystemdServiceFailed"
      - host!=""
      - category!~"security|audit"
    equal: [host]
