# blackbox_exporter modules — synthetic probes for cross-VPS endpoints.
# Plan: 260821-1013-authway-vps-monitor-integration
# Consumers: victoriametrics scrape jobs authway_blackbox_{http,tcp_ldap}.

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # 401 is acceptable for /oidc/v1/userinfo — endpoint exists, just needs token.
      valid_status_codes: [200, 401]
      preferred_ip_protocol: ip4
      fail_if_ssl: false

  # Zitadel probe qua VPN IP 10.200.0.125 sau khi swap ExternalDomain.
  # Zitadel v4 reject request Host không match ExternalDomain → 404 "Instance not found".
  # Set Host header override để Traefik route tới Zitadel container đúng vhost.
  http_2xx_zitadel:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 401]
      preferred_ip_protocol: ip4
      fail_if_ssl: false
      headers:
        Host: zitadel.000nethost.com

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
