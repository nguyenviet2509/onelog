[server]
# root_url + serve_from_sub_path handled via GF_SERVER_* env in docker-compose.yml.
# Env vars override ini — inline value tại đây sẽ dead line, gây confusion khi debug.

[security]
admin_user = admin
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}
# Disable cookie_secure for LAN HTTP (no TLS). Enable when HTTPS ready.
cookie_secure = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
