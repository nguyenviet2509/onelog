# LiteLLM Proxy — routes onelog agent + OpenWebUI to 4 providers.
# Docs: https://docs.litellm.ai/docs/proxy/config
#
# Design notes:
# - Aliases (model_name) hide provider prefixes from clients. OpenWebUI shows
#   "gemini-flash" not "gemini/gemini-2.5-flash" — keeps UI clean.
# - Fallback chain per model: primary fail → try next. Keeps chat responsive
#   during provider outages without user-visible errors.
# - Prompt caching header injected in agent client (not here) because it's
#   per-call opt-in based on system-prompt size heuristic.

model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      # 1M input context (cùng cấp DeepSeek).
      max_input_tokens: 1048576

  # gemini-pro — 2M input context. Chỉ dùng làm context_window_fallback cho
  # trường hợp chat lớn (accumulated tool outputs vượt 1M của deepseek/flash).
  # Cùng GEMINI_API_KEY nên không cần cấp key riêng. KHÔNG expose ra client
  # (không nằm trong DEFAULT_MODELS) — chỉ route nội bộ khi context exceed.
  # gemini-2.5-pro đã deprecated cho new users (Google API 404 "no longer
  # available to new users"), dùng 3.1-pro-preview (cùng 2M ctx, current gen).
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
      max_input_tokens: 2097152

  # gpt-4-mini + claude-sonnet: entries GIỮ để chạy provider adhoc via LiteLLM,
  # nhưng LOẠI khỏi fallback chain vì OPENAI_API_KEY + ANTHROPIC_API_KEY hiện
  # rỗng (chưa cấp) → mọi fallback qua đây sẽ trả 401 và giả tạo cảm giác
  # "fallback hoạt động" trong lúc thực tế chain đã đứt.
  # Sự cố 2026-08-22 09:30: user chat 2M tokens → deepseek 400 context exceed
  # → fallback gpt-4-mini → 401 (key empty) → cooldown 30s → user thấy error.
  # Muốn kích hoạt lại: điền key thật vào .env.llm, thêm alias vào fallbacks.
  - model_name: gpt-4-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      # DeepSeek Chat V3.1 = 128k standard, nhưng account tier hiện tại của iNET
      # thấy được 1M. Set để routing quyết định context_window_fallback đúng.
      max_input_tokens: 1048576

router_settings:
  # Regular fallbacks — trigger khi provider trả 5xx / timeout / rate-limit.
  # KHÔNG chain vào gpt-4-mini/claude-sonnet vì keys rỗng (verified 2026-08-22).
  # gemini-flash ↔ deepseek đủ redundancy: cả 2 đều 1M context, khác provider.
  fallbacks:
    - gemini-flash: ["deepseek"]
    - deepseek: ["gemini-flash"]

  # Context-window fallbacks — chỉ trigger khi provider trả 400 "context length
  # exceeded". Route sang model có context lớn hơn. gemini-pro = 2M context.
  # Nếu cả gemini-pro cũng exceed (chat >2M tokens): fail cứng, user PHẢI start
  # new chat. Không có model nào >2M ở tier consumer.
  context_window_fallbacks:
    - deepseek: ["gemini-pro"]
    - gemini-flash: ["gemini-pro"]

  num_retries: 2
  # [RT-F12] Client-side agent timeout is 30s → keep proxy < that so agent
  # timeout doesn't orphan an in-flight upstream request (double-charge).
  timeout: 25
  # Do not include the failed model in the next fallback attempt.
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  set_verbose: false
  # [V4] JSON stdout logs → tailed by Vector into VictoriaLogs, so we can query
  # cost/latency per (model, key_alias) via LogsQL instead of standing up
  # Prometheus just for LiteLLM.
  json_logs: true
  # Silently drop provider-specific params the target model doesn't support
  # (e.g. anthropic-beta header when routing to gemini). Prevents 4xx from
  # per-provider quirks bubbling to the client.
  drop_params: true
  # [RT-F10] Reject empty / malformed completions instead of returning them
  # as success — otherwise fallback chain never triggers on subtly-broken
  # provider responses. Callback module ships in /app/callbacks.
  # `callbacks:` slot triggers CustomLogger's log_success_event / async_log_success_event
  # per request (verified via `onelog_callback_fired` beacon).
  # `success_callback:` reserved for BUILT-IN tags only (prometheus, s3, datadog,
  # langfuse…) — passing a module.instance string causes proxy startup crash.
  callbacks: custom_callbacks.proxy_handler_instance
  # Built-in prometheus tag → exposes /metrics endpoint for VictoriaMetrics
  # scrape (component up-status + per-model QPS/latency). Coexists with the
  # custom callback above (different slot). Cost analytics still sourced from
  # JSON stdout → Vector → VL — this is only for pipeline-health panels.
  success_callback: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # DB backend disabled — Prisma (LiteLLM's ORM) doesn't honor Postgres
  # `search_path` in DATABASE_URL, so RT-F11 schema isolation is a no-op:
  # tables would land in `public` alongside rag-agent. YAGNI: skip DB for
  # cost tracking, use V4 stdout JSON → VictoriaLogs instead. Virtual keys
  # and budgets live in-memory (lost on restart — acceptable for MVP, we
  # regenerate keys on demand). Revisit when we need multi-day cost history
  # by user.
  # database_url: os.environ/LITELLM_DATABASE_URL
  # Budget alerts: LiteLLM emits `budget_alert` events into json_logs when a
  # virtual key crosses `soft_budget`. Vector tails those into VictoriaLogs
  # where vmalert (existing `alerts` profile) can fire on them — no need to
  # wire Slack directly here.
