# vmalert Prometheus rules for host-level metrics from node_exporter.
# Evaluated against VictoriaMetrics (http://victoriametrics:8428/).
#
# Deployed by the `vmalert-metrics` service (2nd vmalert instance) — the
# original `vmalert` service targets VictoriaLogs and only handles vlogs rules.
# Two instances avoid the datasource endpoint clash (VL exposes
# /select/logsql/stats_query, VM exposes /api/v1/query — vmalert can't hit both
# via a single -datasource.url).
#
# Threshold tuning protocol: observe baseline 1 week, then set threshold ~
# 1.5× p95. Values here are initial rule-of-thumb for an 8-core / 15GB VPS.
#
# All rules get `component: host` label so Alertmanager can route the whole
# group to the Log-Server Telegram thread (see alertmanager.yml).

groups:
  # ─────────────────────────────────────────────────────────────────────────
  # HOST CAPACITY — CPU / RAM / load / swap, sustained thresholds only.
  # ─────────────────────────────────────────────────────────────────────────
  - name: host-capacity
    interval: 30s
    rules:
      - alert: HostCpuHigh
        # 100 − idle% averaged across all cores. Sustained > 80% for 5m = real
        # pressure (single-spike bursts filtered by `for`).
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="onelog-host", mode="idle"}[2m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: capacity
          component: host
        annotations:
          summary: "Host CPU > 80% for 5m on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Sustained CPU pressure. `docker stats --no-stream` to find the culprit container."

      - alert: HostCpuCritical
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="onelog-host", mode="idle"}[2m])) * 100) > 92
        for: 3m
        labels:
          severity: critical
          category: capacity
          component: host
        annotations:
          summary: "Host CPU > 92% for 3m on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Near-saturation. Expect queueing latency across the stack."

      - alert: HostMemoryHigh
        # MemAvailable already accounts for reclaimable cache — used% = 1 − avail/total.
        expr: |
          (1 - node_memory_MemAvailable_bytes{job="onelog-host"} / node_memory_MemTotal_bytes{job="onelog-host"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: capacity
          component: host
        annotations:
          summary: "Host memory > 85% for 5m on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Approaching OOM territory. `docker stats --no-stream` for per-container use."

      - alert: HostMemoryCritical
        expr: |
          (1 - node_memory_MemAvailable_bytes{job="onelog-host"} / node_memory_MemTotal_bytes{job="onelog-host"}) * 100 > 93
        for: 2m
        labels:
          severity: critical
          category: capacity
          component: host
        annotations:
          summary: "Host memory > 93% for 2m on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "OOM imminent. Restart the heaviest container if identified."

      - alert: HostLoadHigh
        # load15 > 1.5× core count means sustained queue depth. Uses on-cpu-count
        # calculation so VPS resize doesn't require rule tuning.
        expr: |
          node_load15{job="onelog-host"} > 1.5 * count without (cpu, mode) (node_cpu_seconds_total{job="onelog-host", mode="idle"})
        for: 10m
        labels:
          severity: warning
          category: capacity
          component: host
        annotations:
          summary: "Host load15 = {{ $value | printf \"%.1f\" }} > 1.5× cores on {{ $labels.instance }}"
          description: "Steady queueing. Look at CPU / IO wait panels for the underlying cause."

      - alert: HostSwapInUse
        # VPS is provisioned without swap; any swap use = someone enabled it or
        # emergency swap file created under pressure.
        expr: |
          (node_memory_SwapTotal_bytes{job="onelog-host"} - node_memory_SwapFree_bytes{job="onelog-host"}) > 0
        for: 5m
        labels:
          severity: warning
          category: capacity
          component: host
        annotations:
          summary: "Swap in use on {{ $labels.instance }} ({{ $value | humanize1024 }}B)"
          description: "VPS not provisioned with swap by design — verify. Check `free -h` and swapon --show."

  # ─────────────────────────────────────────────────────────────────────────
  # HOST DISK — direct probe via node_exporter (redundant with LogsQL rules
  # but wins on latency: node_exporter refreshes at scrape interval, LogsQL
  # rules depend on cron probes that emit every 5m).
  # ─────────────────────────────────────────────────────────────────────────
  - name: host-disk
    interval: 30s
    rules:
      - alert: HostDiskRootWarn
        expr: |
          (1 - node_filesystem_avail_bytes{job="onelog-host", mountpoint="/"} / node_filesystem_size_bytes{job="onelog-host", mountpoint="/"}) * 100 > 75
        for: 10m
        labels:
          severity: warning
          category: capacity
          component: host
        annotations:
          summary: "Root disk > 75% on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Trim: `docker system df` then `docker system prune -a --volumes` carefully."

      - alert: HostDiskRootCritical
        expr: |
          (1 - node_filesystem_avail_bytes{job="onelog-host", mountpoint="/"} / node_filesystem_size_bytes{job="onelog-host", mountpoint="/"}) * 100 > 85
        for: 2m
        labels:
          severity: critical
          category: capacity
          component: host
        annotations:
          summary: "Root disk > 85% on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%) — docker daemon may fail if / fills"
          description: "Free space urgently: prune docker, drop old VL data, or add storage."

      - alert: HostDiskAnyMountCritical
        # Catches secondary mounts (data/, backups/) added post-install.
        expr: |
          (1 - node_filesystem_avail_bytes{job="onelog-host", fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="onelog-host", fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
        for: 2m
        labels:
          severity: critical
          category: capacity
          component: host
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} > 90% on {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Check df -h and clean the offending mount."

  # ─────────────────────────────────────────────────────────────────────────
  # HOST NETWORK — anomaly detection at cheap thresholds. Byte-throughput
  # doesn't get an alert (would require baseline learning); we focus on errors
  # and interface-down instead.
  # ─────────────────────────────────────────────────────────────────────────
  - name: host-network
    interval: 30s
    rules:
      - alert: HostNetworkErrorsRising
        # >5 errors/sec sustained across any physical iface = real issue.
        expr: |
          sum by (instance, device) (
            rate(node_network_receive_errs_total{job="onelog-host", device!~"lo|docker.*|veth.*|br-.*"}[5m])
            + rate(node_network_transmit_errs_total{job="onelog-host", device!~"lo|docker.*|veth.*|br-.*"}[5m])
          ) > 5
        for: 10m
        labels:
          severity: warning
          category: network
          component: host
        annotations:
          summary: "Network errors > 5/s on {{ $labels.instance }} {{ $labels.device }}"
          description: "Check `ip -s link` and dmesg for NIC / cable issues."

      - alert: HostNetworkDropsRising
        expr: |
          sum by (instance, device) (
            rate(node_network_receive_drop_total{job="onelog-host", device!~"lo|docker.*|veth.*|br-.*"}[5m])
            + rate(node_network_transmit_drop_total{job="onelog-host", device!~"lo|docker.*|veth.*|br-.*"}[5m])
          ) > 100
        for: 10m
        labels:
          severity: warning
          category: network
          component: host
        annotations:
          summary: "Network drops > 100/s on {{ $labels.instance }} {{ $labels.device }}"
          description: "Ring buffer overflow or upstream congestion. `ethtool -S {{ $labels.device }}` for detail."

  # ─────────────────────────────────────────────────────────────────────────
  # SCRAPE HEALTH — anything the VM was configured to scrape but can't right
  # now. Includes the host job itself; if it fires, dashboards go blank.
  # ─────────────────────────────────────────────────────────────────────────
  - name: scrape-health
    interval: 30s
    rules:
      - alert: ScrapeTargetDown
        # Catches non-critical targets (vmalert self, future add-ons). Critical
        # data-path services (litellm/victorialogs/qdrant/indexer) handled by
        # CriticalServiceDown with tighter `for: 1m` — exclude here to avoid
        # duplicate pages. Host handled by NodeExporterDown.
        expr: up{job=~"onelog-.*", job!~"onelog-(litellm|victorialogs|qdrant|indexer|host)"} == 0
        for: 3m
        labels:
          severity: warning
          category: monitoring
          component: host
        annotations:
          summary: "Scrape target {{ $labels.job }} down for 3m ({{ $labels.instance }})"
          description: "VictoriaMetrics can't reach the /metrics endpoint. Check the container status and logs."

      - alert: NodeExporterDown
        # Same signal as ScrapeTargetDown but escalated because host telemetry
        # blindness means we lose CPU/disk/network alerting entirely.
        expr: up{job="onelog-host"} == 0
        for: 3m
        labels:
          severity: critical
          category: monitoring
          component: host
        annotations:
          summary: "node-exporter DOWN — host telemetry lost on {{ $labels.instance }}"

      - alert: CriticalServiceDown
        # Fast-fire rule for data-path services: LLM proxy, log ingest, vector
        # DB, indexer. `for: 1m` — user impact is immediate when these are down
        # (chat 502, log lost, embed queue backing up), so we accept a slightly
        # noisier signal in exchange for < 90s time-to-page.
        # Non-critical (vmalert self, host — covered separately) not listed.
        expr: up{job=~"onelog-(litellm|victorialogs|qdrant|indexer)"} == 0
        for: 1m
        labels:
          severity: critical
          category: monitoring
          component: host
        annotations:
          summary: "CRITICAL: {{ $labels.job }} DOWN > 1m ({{ $labels.instance }})"
          description: "Data-path service unavailable — user-facing impact. `docker ps | grep {{ $labels.job }}` and `docker logs` immediately."
          description: "All host alerts blind until this recovers. `docker restart ragstack-node-exporter`."

  # ─────────────────────────────────────────────────────────────────────────
  # QDRANT log_templates — capacity heads-up alerts. KISS: 2 rules, warning-
  # only, `for` dài để không spam. Route → Log-Server topic (thread 880) qua
  # host="logserver". RAM math: 1536-dim × ~13 KB/point → 500k ≈ 6.5 GB.
  # ─────────────────────────────────────────────────────────────────────────
  - name: qdrant-log-templates
    interval: 5m
    rules:
      - alert: QdrantTemplateGrowthHigh
        # Threshold 8k/day sau full rollout Phase 1-6. Empirical baseline:
        # - Cluster count converged 6000 → ~250-300 (20× improvement).
        # - Points/hour (1 hour bucket) ~250 → ~6000/day. Buffer 30% cho spike.
        # - Retention 30d caps 8000 × 30 = 240k points (~3.1GB RAM), dưới hard
        #   cap 500k (6.5GB).
        # Redact stack: WP tables + PHP stack + SQL body/URL/INT + kernel Code
        # hex + register addr + firewall MAC/IP.
        expr: increase(collection_points{id="log_templates"}[24h]) > 8000
        for: 6h
        labels:
          severity: warning
          category: capacity
          component: qdrant
          host: logserver
        annotations:
          summary: "Qdrant log_templates growth > 8000/day sustained 6h"
          description: "Drain3 dedup không hội tụ. Check Vector redact + drain sim_th. Runbook: plans/reports/debugger-260818-0822-qdrant-log-templates-growth.md. Current: {{ $value | humanize }}/24h."

      - alert: QdrantTemplateHardCap
        # Ngưỡng dung lượng — 500k points ≈ 6.5 GB RAM. Cảnh báo trước để bật
        # scalar quantization (int8) hoặc on-disk HNSW.
        expr: collection_points{id="log_templates"} > 500000
        for: 1h
        labels:
          severity: warning
          category: capacity
          component: qdrant
          host: logserver
        annotations:
          summary: "Qdrant log_templates > 500k points ({{ $value | humanize }})"
          description: "~6.5 GB RAM footprint. Enable scalar quantization (int8) hoặc on-disk HNSW."

  # ─────────────────────────────────────────────────────────────────────────
  # EDGE HEALTH — Caddy (reverse proxy) + oauth2-proxy (SSO) + Grafana. These
  # sit on the user-facing edge; loss = user-visible outage. Threshold values
  # are initial guesses; tune after 1-week baseline per project convention.
  # ─────────────────────────────────────────────────────────────────────────
  - name: edge-health
    interval: 30s
    rules:
      - alert: CaddyUpstreamUnhealthy
        # Admin API /metrics exposes caddy_reverse_proxy_upstreams_healthy per
        # upstream (1=healthy, 0=unhealthy from active health checks). Per-
        # request 5xx counters live on the SERVER metrics endpoint which
        # requires `servers { metrics }` in Caddyfile — that exposes /metrics
        # on the public :80 handler (unsafe). We stick to admin metrics.
        expr: caddy_reverse_proxy_upstreams_healthy{job="onelog-caddy"} < 1
        for: 3m
        labels:
          severity: warning
          category: edge
          component: caddy
        annotations:
          summary: "Caddy upstream {{ $labels.upstream }} unhealthy > 3m"
          description: "Reverse-proxy active health check failing. Verify upstream container status."

      - alert: OAuth2ProxyAuthFailureSpike
        # oauth2-proxy exposes oauth2_proxy_requests_total{code="401"|"403"}.
        # 3× baseline error rate over 10m suggests brute force or Zitadel misconfig.
        expr: |
          sum(rate(oauth2_proxy_requests_total{job="onelog-oauth2-proxy", code=~"4.."}[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
          category: security
          component: auth
        annotations:
          summary: "oauth2-proxy 4xx rate > 0.5/s for 10m"
          description: "Check Zitadel availability and unusual client source IPs."

      - alert: GrafanaDown
        expr: up{job="onelog-grafana"} == 0
        for: 3m
        labels:
          severity: warning
          category: monitoring
          component: grafana
        annotations:
          summary: "Grafana DOWN > 3m — dashboards unreachable"
          description: "`docker ps | grep grafana` and `docker logs ragstack-grafana`."

      - alert: CaddyDown
        expr: up{job="onelog-caddy"} == 0
        for: 1m
        labels:
          severity: critical
          category: edge
          component: caddy
        annotations:
          summary: "CRITICAL: Caddy DOWN > 1m — all HTTPS traffic broken"
          description: "User-facing outage. `docker restart ragstack-caddy` immediately after checking logs."

  # ─────────────────────────────────────────────────────────────────────────
  # ALERTMANAGER SELF-HEALTH — silence-of-silence guard. If AM dies, no other
  # alert reaches Telegram. Grafana panel is the fallback signal since AM
  # can't page itself when it's down.
  # ─────────────────────────────────────────────────────────────────────────
  - name: alertmanager-health
    interval: 30s
    rules:
      - alert: AlertmanagerDown
        expr: up{job="onelog-alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          category: monitoring
          component: alertmanager
        annotations:
          summary: "CRITICAL: Alertmanager DOWN > 2m — no alerts will notify"
          description: "Paradox: this alert can't page (AM is the pager). Watch Grafana firing panel. `docker restart ragstack-alertmanager`."

      - alert: AlertmanagerNotificationFailing
        # Fires when > 0.1 notifications/sec fail sustained. SMTP down, Telegram
        # 429 rate limit, or webhook 5xx are common causes.
        expr: |
          sum(rate(alertmanager_notifications_failed_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          category: monitoring
          component: alertmanager
        annotations:
          summary: "Alertmanager notification failures > 0.1/s for 10m"
          description: "Check AM logs for SMTP/webhook errors. Verify Telegram bot token + chat_id."

  # ─────────────────────────────────────────────────────────────────────────
  # NATS HEALTH — indexer queue backbone. Slow consumer / lagging JetStream
  # consumer = indexer falling behind ingest. JetStream storage cap warning
  # protects against runaway stream growth.
  # ─────────────────────────────────────────────────────────────────────────
  - name: nats-health
    interval: 30s
    rules:
      - alert: NatsDown
        expr: up{job="onelog-nats"} == 0
        for: 2m
        labels:
          severity: critical
          category: reliability
          component: nats
        annotations:
          summary: "NATS DOWN > 2m — indexer queue backbone lost"
          description: "Ingest pipeline stalls without NATS. `docker restart ragstack-nats` after checking logs."

      - alert: NatsSlowConsumer
        # gnatsd_varz_slow_consumers = cumulative count of slow consumers
        # (message backlog exceeded pending limit). Any increment worth
        # investigating.
        expr: increase(gnatsd_varz_slow_consumers[10m]) > 0
        for: 5m
        labels:
          severity: warning
          category: reliability
          component: nats
        annotations:
          summary: "NATS slow consumer detected"
          description: "A subscriber can't keep up. Usually indexer batch stalled — check indexer logs."

      - alert: NatsJetstreamStorageHigh
        # Actual exporter metric names:
        #   gnatsd_varz_jetstream_stats_memory / _config_max_memory
        #   gnatsd_varz_jetstream_stats_storage_used / _config_max_storage
        # Trigger when file-storage utilization > 85% of configured cap.
        expr: |
          gnatsd_varz_jetstream_config_max_storage > 0
          and
          (gnatsd_varz_jetstream_stats_storage_used / gnatsd_varz_jetstream_config_max_storage) > 0.85
        for: 30m
        labels:
          severity: warning
          category: capacity
          component: nats
        annotations:
          summary: "NATS JetStream storage > 85% of configured cap"
          description: "Stream approaching quota. Review retention or raise max_bytes."

  # ─────────────────────────────────────────────────────────────────────────
  # AUTHWAY-VPS — Zitadel IdP monitoring (plan 260821-1013).
  # All rules carry `cluster: authway` → routed to Log-Server topic (880) via
  # alertmanager matcher. Runbook: docs/authway-runbook.md.
  # ─────────────────────────────────────────────────────────────────────────
  - name: authway-critical
    interval: 30s
    rules:
      - alert: AuthwayZitadelDown
        # `absent()` guards against vmagent scrape failure (up{} disappears
        # instead of going to 0 when target is unreachable).
        expr: |
          up{job="authway_zitadel"} == 0 or absent(up{job="authway_zitadel"})
        for: 1m
        labels:
          severity: critical
          cluster: authway
          service: zitadel
        annotations:
          summary: "Zitadel down > 1m — new logins blocked"
          description: "Zitadel {{ $labels.instance }} unscrapeable. Check container `authway-prod-zitadel-1` on authway-vps."
          runbook: "docs/authway-runbook.md#zitadel-down"

      - alert: AuthwayHttpsProbeFail
        expr: probe_success{job="authway_blackbox_http"} == 0
        for: 2m
        labels:
          severity: critical
          cluster: authway
        annotations:
          summary: "Zitadel HTTPS endpoint {{ $labels.instance }} probe fail > 2m"
          description: "End-to-end synthetic probe fails — login flow broken."
          runbook: "docs/authway-runbook.md#https-probe-fail"

      - alert: AuthwayNodeDown
        expr: |
          up{job="authway_node"} == 0 or absent(up{job="authway_node"})
        for: 2m
        labels:
          severity: critical
          cluster: authway
        annotations:
          summary: "authway-vps host unreachable (node_exporter down > 2m)"
          description: "node_exporter on 10.200.0.125:9100 not scrapeable — VPS may be down or network partitioned."
          runbook: "docs/authway-runbook.md#host-down"

  - name: authway-warning
    interval: 60s
    rules:
      - alert: AuthwayLdapBindFail
        expr: probe_success{job="authway_blackbox_tcp_ldap"} == 0
        for: 3m
        labels:
          severity: warning
          cluster: authway
          service: ldap-zimbra
        annotations:
          summary: "LDAP Zimbra 103.57.220.98:389 unreachable > 3m"
          description: "New JIT provisioning / LDAP-backed logins will fail. Active sessions unaffected."
          runbook: "docs/authway-runbook.md#ldap-fail"

      - alert: AuthwayCertExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job="authway_blackbox_http"} - time()) < 7 * 24 * 3600
          and
          probe_ssl_earliest_cert_expiry{job="authway_blackbox_http"} > 0
        for: 1h
        labels:
          severity: warning
          cluster: authway
        annotations:
          summary: "Traefik cert authway-vps expiring in < 7d"
          description: "Check ACME renewal: `docker logs authway-prod-traefik-1 | grep -i acme`."

      - alert: AuthwayDiskLow
        expr: |
          (node_filesystem_avail_bytes{job="authway_node",fstype!~"tmpfs|overlay|squashfs"}
           /
           node_filesystem_size_bytes{job="authway_node",fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
          cluster: authway
        annotations:
          summary: "authway-vps disk < 15% free on {{ $labels.mountpoint }}"
          description: "Postgres grows. Backup / vacuum / expand disk."

      - alert: AuthwayHostCpuHigh
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="authway_node", mode="idle"}[2m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          cluster: authway
        annotations:
          summary: "authway-vps CPU > 85% for 5m"
          description: "Sustained CPU pressure. `docker stats --no-stream` on authway-vps to find the culprit."

      - alert: AuthwayHostMemoryHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes{job="authway_node"} / node_memory_MemTotal_bytes{job="authway_node"})) > 0.90
        for: 5m
        labels:
          severity: warning
          cluster: authway
        annotations:
          summary: "authway-vps memory > 90% for 5m"
          description: "Check Postgres shared_buffers / Zitadel heap. OOM risk imminent."

  # ─────────────────────────────────────────────────────────────────────────
  # ONEMCP-VPS — MCP connector hub monitoring (plan 260821-1346).
  # All rules carry `cluster: onemcp` → routed to Log-Server topic (880).
  # Runbook: docs/onemcp-runbook.md.
  # ─────────────────────────────────────────────────────────────────────────
  - name: onemcp-critical
    interval: 30s
    rules:
      - alert: OnemcpBackendDown
        expr: |
          up{job="onemcp_backend"} == 0 or absent(up{job="onemcp_backend"})
        for: 1m
        labels:
          severity: critical
          cluster: onemcp
          service: backend
        annotations:
          summary: "OneMCP backend down > 1m — API + portal broken"
          description: "backend {{ $labels.instance }} unscrapeable. Check container `onemcp-backend-1` on onemcp-vps."
          runbook: "docs/onemcp-runbook.md#backend-down"

      - alert: OnemcpPostgresDown
        expr: |
          up{job="onemcp_postgres"} == 0 or absent(up{job="onemcp_postgres"})
        for: 1m
        labels:
          severity: critical
          cluster: onemcp
          service: postgres
        annotations:
          summary: "OneMCP Postgres exporter down — DB dead or exporter crashed"
          description: "pgvector DB is source of truth for skills/artifacts. Every backend query fails."
          runbook: "docs/onemcp-runbook.md#postgres-down"

      - alert: OnemcpNodeDown
        expr: |
          up{job="onemcp_node"} == 0 or absent(up{job="onemcp_node"})
        for: 2m
        labels:
          severity: critical
          cluster: onemcp
        annotations:
          summary: "onemcp-vps host unreachable (node_exporter down > 2m)"
          description: "VPS may be down or network partitioned."
          runbook: "docs/onemcp-runbook.md#host-down"

      - alert: OnemcpHttpsProbeFail
        expr: probe_success{job="onemcp_blackbox_http"} == 0
        for: 2m
        labels:
          severity: critical
          cluster: onemcp
        annotations:
          summary: "OneMCP endpoint {{ $labels.instance }} probe fail > 2m"
          description: "Synthetic HTTP probe fails — backend not serving even loopback."
          runbook: "docs/onemcp-runbook.md#probe-fail"

  - name: onemcp-warning
    interval: 60s
    rules:
      - alert: OnemcpRedisDown
        expr: |
          up{job="onemcp_redis"} == 0 or absent(up{job="onemcp_redis"})
        for: 2m
        labels:
          severity: warning
          cluster: onemcp
          service: redis
        annotations:
          summary: "OneMCP Redis exporter down — cache misses to Postgres"
          description: "Not critical (cache regenerable), but backend latency will rise."

      - alert: OnemcpHostCpuHigh
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{job="onemcp_node", mode="idle"}[2m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          cluster: onemcp
        annotations:
          summary: "onemcp-vps CPU > 85% for 5m"
          description: "Check backend or TEI embedding load. `docker stats --no-stream`."

      - alert: OnemcpHostMemoryHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes{job="onemcp_node"} / node_memory_MemTotal_bytes{job="onemcp_node"})) > 0.90
        for: 5m
        labels:
          severity: warning
          cluster: onemcp
        annotations:
          summary: "onemcp-vps memory > 90% for 5m"
          description: "Postgres shared_buffers or backend heap. OOM imminent."

      - alert: OnemcpDiskLow
        expr: |
          (node_filesystem_avail_bytes{job="onemcp_node",fstype!~"tmpfs|overlay|squashfs"}
           /
           node_filesystem_size_bytes{job="onemcp_node",fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
          cluster: onemcp
        annotations:
          summary: "onemcp-vps disk < 15% free on {{ $labels.mountpoint }}"
          description: "MinIO artifacts + pg-data grow. Check backup dir + old container images."

      - alert: OnemcpBackend5xxSpike
        expr: |
          sum(rate(onemcp_http_requests_total{job="onemcp_backend",status_code=~"5.."}[5m]))
          /
          sum(rate(onemcp_http_requests_total{job="onemcp_backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          cluster: onemcp
          service: backend
        annotations:
          summary: "Backend 5xx rate > 5% for 5m"
          description: "Check `docker logs onemcp-backend-1 --tail=100` for exception traces."
